name: Release desktop

# One self-contained wena-desktop executable for every platform a GitHub
# runner can build it on - natively, under QEMU, or by cross-compiling - each
# smoke-tested and attached to the release with its .sha256.
#
# Started by `./build.sh release` (menu option 3, Release):
#   - with a version (Release next version): the CHANGELOG already names it
#     (`# v0.01 2026-10-03 Wena release`); this workflow tags the commit,
#     creates the GitHub Release with that section as its notes, starts
#     release-all.yml for the bootstrap targets, and builds and attaches;
#   - without (Build missing files): builds and attaches to the newest
#     existing release, replacing files of the same name.
#
#   gh workflow run release-desktop.yml -R wekan/wena -f version=v0.01
#
# SDL2 and SQLite come from the checksum-pinned sources in
# config/release-dependencies.json (scripts/build_desktop_release.sh).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New release, as named in CHANGELOG.md (e.g. v0.01). Empty = attach to the newest release'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: wena-release-desktop-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare the release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Create the release, or find the newest one
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if test -n "$VERSION"; then
            python3 scripts/release_version.py notes "$VERSION" > "$RUNNER_TEMP/notes.md"
            if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
            fi
            tag=$VERSION
            # The bootstrap targets attach to the newest release, which is now this one.
            gh workflow run release-all.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          else
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release: $tag" >> "$GITHUB_STEP_SUMMARY"

  linux:
    name: ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners.
          - { target: linux-amd64, runner: ubuntu-24.04, platform: linux/amd64, image: 'ubuntu:22.04' }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, platform: linux/arm64, image: 'ubuntu:22.04' }
          # QEMU: slower, same build and the same smoke tests.
          - { target: linux-armhf, runner: ubuntu-24.04, platform: linux/arm/v7, image: 'ubuntu:22.04' }
          - { target: linux-riscv64, runner: ubuntu-24.04, platform: linux/riscv64, image: 'ubuntu:22.04' }
          - { target: linux-ppc64le, runner: ubuntu-24.04, platform: linux/ppc64le, image: 'ubuntu:22.04' }
          - { target: linux-s390x, runner: ubuntu-24.04, platform: linux/s390x, image: 'ubuntu:22.04' }
          - { target: linux-i686, runner: ubuntu-24.04, platform: linux/386, image: 'debian:bookworm' }
          - { target: linux-armel, runner: ubuntu-24.04, platform: linux/arm/v5, image: 'debian:bookworm' }
          - { target: linux-mips64le, runner: ubuntu-24.04, platform: linux/mips64le, image: 'debian:bookworm' }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: docker/setup-qemu-action@v3
      - name: Build, smoke-test and package in ${{ matrix.image }} (${{ matrix.platform }})
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --platform "$PLATFORM" -v "$PWD:/w" -w /w "$IMAGE" \
            sh scripts/build_desktop_release_container.sh "$TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: wena-desktop-${{ matrix.target }}
          path: release-desktop/
          if-no-files-found: error

  macos:
    name: ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-arm64, runner: macos-15 }
          - { target: macos-amd64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build, smoke-test and package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p .tools/tmp
          export TMPDIR="$PWD/.tools/tmp"
          sh scripts/build_desktop_release.sh "$TARGET" "dist/release/$TARGET/wena-desktop"
          export WENA_DATABASE="$RUNNER_TEMP/smoke/board.sqlite" WENA_LOG_DIR="$RUNNER_TEMP/smoke/log"
          SDL_VIDEODRIVER=dummy "dist/release/$TARGET/wena-desktop" --smoke
          SDL_VIDEODRIVER=dummy "dist/release/$TARGET/wena-desktop" --smoke
          cat "$WENA_LOG_DIR/desktop.log"
          python3 scripts/package_desktop_release.py binary "$TARGET" "dist/release/$TARGET/wena-desktop" release-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: wena-desktop-${{ matrix.target }}
          path: release-desktop/
          if-no-files-found: error

  windows-build:
    name: ${{ matrix.target }} (cross)
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        target: [windows-amd64, windows-i686, windows-arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install MinGW-w64
        if: matrix.target != 'windows-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 binutils-mingw-w64
      - name: Cross-compile and package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p .tools/tmp
          export TMPDIR="$PWD/.tools/tmp"
          sh scripts/build_desktop_release.sh "$TARGET" "dist/release/$TARGET/wena-desktop.exe"
          python3 scripts/package_desktop_release.py binary "$TARGET" "dist/release/$TARGET/wena-desktop.exe" release-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: wena-desktop-${{ matrix.target }}
          path: release-desktop/
          if-no-files-found: error

  windows-smoke:
    name: ${{ matrix.target }} (smoke test)
    needs: windows-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-amd64, runner: windows-2025 }
          - { target: windows-i686, runner: windows-2025 }
          - { target: windows-arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wena-desktop-${{ matrix.target }}
          path: release-desktop
      - name: Create a board, reopen it, check the log
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "release-desktop/wena-desktop-$env:TARGET.exe"
          $env:SDL_VIDEODRIVER = 'dummy'
          $env:WENA_DATABASE = "$env:RUNNER_TEMP\smoke\board.sqlite"
          $env:WENA_LOG_DIR = "$env:RUNNER_TEMP\smoke\log"
          foreach ($run in 1, 2) {
            $process = Start-Process -FilePath $exe -ArgumentList '--smoke' -Wait -PassThru -NoNewWindow
            if ($process.ExitCode -ne 0) { throw "smoke run $run exited with $($process.ExitCode)" }
          }
          if (-not (Test-Path $env:WENA_DATABASE)) { throw 'the board was not created' }
          Get-Content "$env:WENA_LOG_DIR\desktop.log"
          if (-not (Select-String -Path "$env:WENA_LOG_DIR\desktop.log" -Pattern 'exit status 0' -Quiet)) { throw 'no clean exit logged' }

  attach:
    name: Attach to the release
    needs: [prepare, linux, macos, windows-build, windows-smoke]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wena-desktop-*
          path: release-desktop
          merge-multiple: true
      - name: Check, add the notices, and upload what was built
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/package_desktop_release.py notices release-desktop
          cd release-desktop
          sha256sum -c ./*.sha256
          mapfile -t assets < <(find . -maxdepth 1 -type f -print | LC_ALL=C sort)
          uploaded=false
          for attempt in 1 2 3; do
            if timeout 15m gh release upload --repo "$GITHUB_REPOSITORY" "$TAG" "${assets[@]}" --clobber; then
              uploaded=true
              break
            fi
            echo "::warning::Upload attempt ${attempt}/3 failed"
          done
          test "$uploaded" = true
          cd ..
          missing=$(python3 - <<'PY'
          import importlib.util, pathlib
          spec = importlib.util.spec_from_file_location("p", "scripts/package_desktop_release.py")
          p = importlib.util.module_from_spec(spec); spec.loader.exec_module(p)
          have = {f.name for f in pathlib.Path("release-desktop").iterdir()}
          print(" ".join(t for t in p.TARGETS if p.executable_name(t) not in have))
          PY
          )
          {
            echo "### Wena desktop on ${TAG}"
            printf -- '- %s\n' "${assets[@]#./}"
            if test -n "$missing"; then echo "**Not built:** $missing"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if test -n "$missing"; then
            echo "::error::Not built: $missing (the others are attached; rerun to complete)"
            exit 1
          fi
