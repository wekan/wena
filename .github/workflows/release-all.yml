name: Release all

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Ready targets are cataloged in config/targets.tsv. A planned target becomes ready
# only when its .github/release/<target>.sh script produces a verified artifact.
jobs:
  resolve-release:
    name: Resolve newest existing release
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Resolve newest github.com/wekan/wena release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response_file="${RUNNER_TEMP}/wena-latest-release.json"
          curl --fail-with-body --silent --show-error \
            --request GET \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$response_file" \
            https://api.github.com/repos/wekan/wena/releases/latest
          python3 - "$response_file" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          response_path, output_path = sys.argv[1:]
          with open(response_path, encoding="utf-8") as response:
              release = json.load(response)
          release_id = release.get("id")
          release_tag = release.get("tag_name")
          if not isinstance(release_id, int) or not release_tag:
              raise SystemExit("latest Wena release response lacks id or tag_name")
          with open(output_path, "a", encoding="utf-8") as output:
              output.write("release_id={}\n".format(release_id))
              output.write("release_tag={}\n".format(release_tag))
          PY

  cross-compile:
    name: ${{ matrix.name }}
    needs: resolve-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-arm64
            name: Linux arm64
            runner: ubuntu-24.04
          - target: linux-amd64
            name: Linux amd64
            runner: ubuntu-24.04
          - target: linux-armhf
            name: Linux armhf
            runner: ubuntu-24.04
          - target: windows-amd64
            name: Windows amd64
            runner: ubuntu-24.04
          - target: macos-arm64
            name: macOS arm64
            runner: macos-15
          - target: macos-amd64
            name: macOS amd64
            runner: macos-15
          - target: amigaos-m68k
            name: AmigaOS 3.x m68k
            runner: ubuntu-24.04
          - target: aros-x86
            name: AROS x86
            runner: ubuntu-24.04
          - target: android-arm64
            name: Android arm64
            runner: ubuntu-24.04
          - target: ios-arm64
            name: iOS arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Linux arm64 cross-compiler
        if: matrix.target == 'linux-arm64'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu

      - name: Install Linux armhf cross-compiler
        if: matrix.target == 'linux-armhf'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-arm-linux-gnueabihf

      - name: Install Windows amd64 cross-compiler
        if: matrix.target == 'windows-amd64'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Install Android NDK r29
        if: matrix.target == 'android-arm64'
        shell: bash
        run: |
          sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Cross-compile
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/wena.py build "$TARGET"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: wena-${{ matrix.target }}
          path: dist/${{ matrix.target }}/
          if-no-files-found: error

  collect-assets:
    name: Collect deterministic release assets
    needs: cross-compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download verified target artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wena-*
          path: incoming

      - name: Collect release assets and provenance
        shell: bash
        run: |
          python3 scripts/collect_release_assets.py \
            --catalog config/targets.tsv \
            --incoming incoming \
            --output release-assets \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"

      - name: Store collected release assets
        uses: actions/upload-artifact@v4
        with:
          name: wena-release-assets
          path: release-assets/
          if-no-files-found: error

  upload-assets:
    name: Attach assets to newest existing release
    needs: [resolve-release, collect-assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download collected release assets
        uses: actions/download-artifact@v4
        with:
          name: wena-release-assets
          path: release-assets

      - name: Replace release assets deterministically
        id: upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
        run: |
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | LC_ALL=C sort)
          if test "${#assets[@]}" -eq 0; then
            echo "::error::No collected release assets were downloaded"
            exit 1
          fi
          uploaded=false
          for attempt in 1 2 3; do
            echo "Uploading ${#assets[@]} assets to ${RELEASE_TAG} (attempt ${attempt}/3)"
            if timeout 10m gh release upload \
              --repo wekan/wena \
              "$RELEASE_TAG" \
              "${assets[@]}" \
              --clobber; then
              uploaded=true
              break
            fi
            echo "::warning::Release asset upload attempt ${attempt}/3 failed"
          done
          if test "$uploaded" != true; then
            echo "::error::Could not attach release assets after 3 attempts"
            exit 1
          fi

      - name: Verify attached asset names, sizes, and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.resolve-release.outputs.release_id }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
        run: |
          verified=false
          for attempt in 1 2 3; do
            if timeout 2m gh api \
              --method GET \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "repos/wekan/wena/releases/${RELEASE_ID}/assets?per_page=100" \
              > release-assets-response.json && \
              python3 scripts/verify_release_assets.py \
                --local release-assets \
                --response release-assets-response.json; then
              verified=true
              break
            fi
            echo "::warning::Post-upload verification attempt ${attempt}/3 failed"
          done
          if test "$verified" != true; then
            echo "::error::Release ${RELEASE_TAG} failed post-upload verification"
            exit 1
          fi
          asset_count=$(find release-assets -maxdepth 1 -type f | wc -l)
          {
            echo "### Wena release assets"
            echo "Attached and verified ${asset_count} assets on existing release ${RELEASE_TAG}."
            echo "Replacement policy: deterministic names with \`--clobber\`."
          } >> "$GITHUB_STEP_SUMMARY"
