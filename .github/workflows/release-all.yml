name: Release all

# The one release workflow: the Wena desktop - the native Nuklear GUI - for
# every platform in config/targets.tsv, each one self-contained file named
# wena-TARGET (wena-linux-amd64, wena-windows-amd64.exe, wena-aros-x86 ...)
# with SDL2, SQLite, the font, the translations and the licenses linked in,
# attached to the release beside one SHA256SUMS.
#
# Started by `./build.sh release` (menu option 3, Release):
#   - with a version (Release next version): the CHANGELOG already names it
#     (`# v0.02 2026-10-04 Wena release`); this workflow tags the commit,
#     creates the GitHub Release with that section as its notes, and builds
#     and attaches;
#   - without (Build missing files): builds and attaches to the newest
#     existing release, replacing files of the same name.
#
#   gh workflow run release-all.yml -R wekan/wena -f version=v0.02
#
# SDL2 and SQLite come from the checksum-pinned sources in
# config/release-dependencies.json.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New release, as named in CHANGELOG.md (e.g. v0.02). Empty = attach to the newest release'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: wena-release-all-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare the release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Create the release, or find the newest one
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if test -n "$VERSION"; then
            python3 scripts/release_version.py notes "$VERSION" > "$RUNNER_TEMP/notes.md"
            if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
            fi
            tag=$VERSION
          else
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release: $tag" >> "$GITHUB_STEP_SUMMARY"

  linux:
    name: ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners.
          - { target: linux-amd64, runner: ubuntu-24.04, platform: linux/amd64, image: 'ubuntu:22.04' }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, platform: linux/arm64, image: 'ubuntu:22.04' }
          # QEMU: slower, same build and the same smoke tests.
          - { target: linux-armhf, runner: ubuntu-24.04, platform: linux/arm/v7, image: 'ubuntu:22.04' }
          - { target: linux-armel, runner: ubuntu-24.04, platform: linux/arm/v5, image: 'arm32v5/debian:bookworm' }
          - { target: linux-i686, runner: ubuntu-24.04, platform: linux/386, image: 'debian:bookworm' }
          - { target: linux-riscv64, runner: ubuntu-24.04, platform: linux/riscv64, image: 'ubuntu:22.04' }
          - { target: linux-ppc64le, runner: ubuntu-24.04, platform: linux/ppc64le, image: 'ubuntu:22.04' }
          - { target: linux-s390x, runner: ubuntu-24.04, platform: linux/s390x, image: 'ubuntu:22.04' }
          # debian:bookworm no longer lists armel or mips64le; Debian publishes
          # them per architecture (arm32v5/debian, mips64le/debian), same glibc 2.36.
          - { target: linux-mips64le, runner: ubuntu-24.04, platform: linux/mips64le, image: 'mips64le/debian:bookworm' }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: docker/setup-qemu-action@v3
      - name: Build, smoke-test and package in ${{ matrix.image }} (${{ matrix.platform }})
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --platform "$PLATFORM" -v "$PWD:/w" -w /w "$IMAGE" \
            sh scripts/build_desktop_release_container.sh "$TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: wena-${{ matrix.target }}
          path: release/
          if-no-files-found: error

  bsd:
    name: ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: freebsd-amd64, os: freebsd, arch: x86-64, version: '15.1' }
          - { target: freebsd-arm64, os: freebsd, arch: arm64, version: '15.1' }
          - { target: netbsd-amd64, os: netbsd, arch: x86-64, version: '10.1' }
          - { target: netbsd-arm64, os: netbsd, arch: arm64, version: '10.1' }
          - { target: openbsd-amd64, os: openbsd, arch: x86-64, version: '7.9' }
          - { target: openbsd-arm64, os: openbsd, arch: arm64, version: '7.9' }
          - { target: dragonflybsd-amd64, os: dragonflybsd, arch: x86-64, version: '6.4.2' }
          - { target: haiku-amd64, os: haiku, arch: x86-64, version: 'r1beta5' }
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build, smoke-test and package on ${{ matrix.os }} ${{ matrix.version }} (${{ matrix.arch }})
        uses: cross-platform-actions/action@v1.6.0
        with:
          operating_system: ${{ matrix.os }}
          architecture: ${{ matrix.arch }}
          version: ${{ matrix.version }}
          memory: 6G
          cpu_count: 4
          run: sh scripts/build_desktop_release_vm.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: wena-${{ matrix.target }}
          path: release/
          if-no-files-found: error

  macos:
    name: ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-arm64, runner: macos-15 }
          - { target: macos-amd64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build, smoke-test and package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p .tools/tmp
          export TMPDIR="$PWD/.tools/tmp"
          sh scripts/build_desktop_release.sh "$TARGET" "dist/release/$TARGET/wena"
          export WENA_DATABASE="$RUNNER_TEMP/smoke/board.sqlite" WENA_LOG_DIR="$RUNNER_TEMP/smoke/log"
          SDL_VIDEODRIVER=dummy "dist/release/$TARGET/wena" --smoke
          SDL_VIDEODRIVER=dummy "dist/release/$TARGET/wena" --smoke
          cat "$WENA_LOG_DIR/desktop.log"
          "dist/release/$TARGET/wena" --licenses > /dev/null
          python3 scripts/package_desktop_release.py binary "$TARGET" "dist/release/$TARGET/wena" release
      - uses: actions/upload-artifact@v4
        with:
          name: wena-${{ matrix.target }}
          path: release/
          if-no-files-found: error

  windows-build:
    name: ${{ matrix.target }} (cross)
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        target: [windows-amd64, windows-i686, windows-arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install MinGW-w64
        if: matrix.target != 'windows-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 binutils-mingw-w64
      - name: Cross-compile and package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p .tools/tmp
          export TMPDIR="$PWD/.tools/tmp"
          sh scripts/build_desktop_release.sh "$TARGET" "dist/release/$TARGET/wena.exe"
          python3 scripts/package_desktop_release.py binary "$TARGET" "dist/release/$TARGET/wena.exe" release
      - uses: actions/upload-artifact@v4
        with:
          name: wena-${{ matrix.target }}
          path: release/
          if-no-files-found: error

  windows-smoke:
    name: ${{ matrix.target }} (smoke test)
    needs: windows-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-amd64, runner: windows-2025 }
          - { target: windows-i686, runner: windows-2025 }
          - { target: windows-arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wena-${{ matrix.target }}
          path: release
      - name: Create a board, reopen it, check the log
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "release/wena-$env:TARGET.exe"
          $env:SDL_VIDEODRIVER = 'dummy'
          $env:WENA_DATABASE = "$env:RUNNER_TEMP\smoke\board.sqlite"
          $env:WENA_LOG_DIR = "$env:RUNNER_TEMP\smoke\log"
          foreach ($run in 1, 2) {
            $process = Start-Process -FilePath $exe -ArgumentList '--smoke' -Wait -PassThru -NoNewWindow
            if ($process.ExitCode -ne 0) { throw "smoke run $run exited with $($process.ExitCode)" }
          }
          if (-not (Test-Path $env:WENA_DATABASE)) { throw 'the board was not created' }
          Get-Content "$env:WENA_LOG_DIR\desktop.log"
          if (-not (Select-String -Path "$env:WENA_LOG_DIR\desktop.log" -Pattern 'exit status 0' -Quiet)) { throw 'no clean exit logged' }

  amiga:
    name: ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: amigaos-m68k }
          - { target: amigaos4-ppc }
          - { target: aros-x86 }
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build in the pinned amigadev/crosstools image and package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p .tools/tmp
          export TMPDIR="$PWD/.tools/tmp"
          sh scripts/build_desktop_amiga.sh "$TARGET" "dist/release/$TARGET/wena"
          python3 scripts/check_release_executable.py "$TARGET" "dist/release/$TARGET/wena"
          python3 scripts/package_desktop_release.py binary "$TARGET" "dist/release/$TARGET/wena" release
      - uses: actions/upload-artifact@v4
        with:
          name: wena-${{ matrix.target }}
          path: release/
          if-no-files-found: error

  android:
    name: ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: android-arm64 }
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build, sign and package the APK
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          WENA_VERSION: ${{ needs.prepare.outputs.tag }}
          KEYSTORE_BASE64: ${{ secrets.WENA_ANDROID_KEYSTORE_BASE64 }}
          WENA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.WENA_ANDROID_KEYSTORE_PASSWORD }}
          WENA_ANDROID_KEY_ALIAS: ${{ secrets.WENA_ANDROID_KEY_ALIAS }}
          WENA_ANDROID_KEY_PASSWORD: ${{ secrets.WENA_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p .tools/tmp
          export TMPDIR="$PWD/.tools/tmp"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          # The runner image has the SDK but does not put sdkmanager on PATH.
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --install "ndk;29.0.14206865" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/29.0.14206865"
          # The same release key every time, or an update does not install over
          # the previous version. Without the secrets the APK is debug-signed.
          if test -n "$KEYSTORE_BASE64"; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wena.keystore"
            export WENA_ANDROID_KEYSTORE="$RUNNER_TEMP/wena.keystore"
          else
            unset WENA_ANDROID_KEYSTORE_PASSWORD WENA_ANDROID_KEY_ALIAS WENA_ANDROID_KEY_PASSWORD
            echo "::warning::No WENA_ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a debug key"
          fi
          sh scripts/build_desktop_android.sh "dist/release/$TARGET/wena.apk"
          python3 scripts/check_release_executable.py "$TARGET" "dist/release/$TARGET/wena.apk"
          python3 scripts/package_desktop_release.py binary "$TARGET" "dist/release/$TARGET/wena.apk" release
      - uses: actions/upload-artifact@v4
        with:
          name: wena-${{ matrix.target }}
          path: release/
          if-no-files-found: error

  ios:
    name: ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: ios-arm64 }
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build the unsigned IPA, smoke-test in the Simulator, and package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          WENA_VERSION: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p .tools/tmp
          export TMPDIR="$PWD/.tools/tmp"
          sh scripts/build_desktop_ios.sh "dist/release/$TARGET/wena.ipa"
          python3 scripts/check_release_executable.py "$TARGET" "dist/release/$TARGET/wena.ipa"
          sh scripts/build_desktop_ios.sh --simulator dist/simulator/Wena.app
          device=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, found in sorted(devices.items(), reverse=True)
                     if "iOS" in runtime for d in found if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$device"
          xcrun simctl install "$device" dist/simulator/Wena.app
          xcrun simctl launch --console "$device" fi.wekan.wena --smoke | tee "$RUNNER_TEMP/smoke.log"
          grep -q "Wena desktop smoke passed" "$RUNNER_TEMP/smoke.log"
          python3 scripts/package_desktop_release.py binary "$TARGET" "dist/release/$TARGET/wena.ipa" release
      - uses: actions/upload-artifact@v4
        with:
          name: wena-${{ matrix.target }}
          path: release/
          if-no-files-found: error

  attach:
    name: Attach to the release
    needs: [prepare, linux, bsd, macos, windows-build, windows-smoke, amiga, android, ios]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wena-*
          path: release
          merge-multiple: true
      - name: Checksum and upload what was built
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/package_desktop_release.py sums release
          (cd release && sha256sum -c SHA256SUMS)
          mapfile -t assets < <(find release -maxdepth 1 -type f -print | LC_ALL=C sort)
          uploaded=false
          for attempt in 1 2 3; do
            if timeout 15m gh release upload --repo "$GITHUB_REPOSITORY" "$TAG" "${assets[@]}" --clobber; then
              uploaded=true
              break
            fi
            echo "::warning::Upload attempt ${attempt}/3 failed"
          done
          test "$uploaded" = true
          missing=$(python3 scripts/package_desktop_release.py missing release)
          {
            echo "### Wena on ${TAG}"
            printf -- '- %s\n' "${assets[@]#release/}"
            if test -n "$missing"; then echo "**Not built:** $missing"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if test -n "$missing"; then
            echo "::error::Not built: $missing (the others are attached; rerun to complete)"
            exit 1
          fi
